<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Mario | Vibe Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* --- CSS 樣式區 --- */
        body {
            margin: 0;
            background: #222; /* 移除外部圖片，改用深色背景打底，以防萬一 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: 'Press Start 2P', cursive; /* 應用像素風格字體 */
            overflow: hidden;
            user-select: none; /* 防止連點選取文字 */
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            border: 4px solid #000; /* 增加一個像素風格外框 */
        }
        canvas {
            background: #5C94FC; /* 預設天空藍，如果JS還沒載入時顯示 */
            display: block;
        }
        /* --- UI 介面調整 --- */
        .ui {
            position: absolute;
            top: 15px; /* 稍微往下移一點 */
            left: 15px;
            font-size: 14px; /* 稍微調整字體大小以配合寬行距 */
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            line-height: 2.2; /* 【修改點】增加行距寬度 */
        }
        .hud-right {
            position: absolute;
            top: 15px;
            right: 15px;
            text-align: right;
            pointer-events: none;
            text-shadow: 2px 2px 0 #000;
            font-size: 14px;
            line-height: 2.2; /* 【修改點】增加行距寬度 */
        }
        /* --- 訊息與按鈕區域 --- */
        #message {
            position: absolute;
            top: 45%; /* 稍微往上調，讓出空間給按鈕 */
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: flex; 
            flex-direction: column;
            align-items: center;
            gap: 25px; /* 增加元素間距 */
            z-index: 10; 
        }
        #msgTitle {
            font-size: 36px; 
            font-weight: bold;
            text-shadow: 4px 4px 0 #000;
            margin: 0; 
            margin-bottom: 10px;
        }
        #startPrompt {
            font-size: 16px;
            text-shadow: 2px 2px 0 #000;
            margin: 0;
        }
        /* --- 像素三角形播放鍵 --- */
        #playButton {
            width: 0;
            height: 0;
            border-top: 25px solid transparent;
            border-bottom: 25px solid transparent;
            border-left: 40px solid #fff; /* 像素風格白色三角形 */
            cursor: pointer;
            filter: drop-shadow(4px 4px 0 #000); /* 像素風格陰影 */
            transition: transform 0.1s;
        }
        #playButton:hover {
             transform: scale(1.1); /* 滑鼠移上去放大一點 */
        }
