<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Mario | Polished Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* --- CSS 樣式區 (維持不變) --- */
        body {
            margin: 0;
            background: #222; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            border: 4px solid #000;
            width: 800px;
            height: 400px;
            background: #5C94FC;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui {
            position: absolute; top: 20px; left: 20px;
            font-size: 14px; text-shadow: 3px 3px 0 #000;
            pointer-events: none; line-height: 2.5;
        }
        .hud-right {
            position: absolute; top: 20px; right: 20px;
            text-align: right; pointer-events: none;
            text-shadow: 3px 3px 0 #000; font-size: 14px; line-height: 2.5;
        }
        #message {
            position: absolute; top: 48%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: flex; flex-direction: column;
            align-items: center; gap: 30px;
            z-index: 10; width: 100%;
        }
        #msgTitle {
            font-size: 32px; font-weight: bold;
            text-shadow: 4px 4px 0 #000; margin: 0; 
            white-space: pre-wrap; line-height: 1.8;
        }
        #startPrompt {
            font-size: 16px; text-shadow: 2px 2px 0 #000;
            margin: 0; line-height: 1.5;
        }
        #playButton {
            width: 0; height: 0;
            border-top: 25px solid transparent; border-bottom: 25px solid transparent;
            border-left: 40px solid #fff;
            cursor: pointer; filter: drop-shadow(4px 4px 0 #000); 
            transition: transform 0.1s;
        }
        #playButton:hover { transform: scale(1.1); }
        #playButton:active { transform: scale(0.9); filter: drop-shadow(2px 2px 0 #000); }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div class="ui">
            <div>Level: <span id="levelDisplay">1</span></div>
            <div>Lives: <span id="livesDisplay">❤️❤️❤️</span></div>
        </div>
        <div class="hud-right">
            <div>Score: <span id="scoreDisplay">0</span></div>
            <div style="font-size: 10px; color: #ffd700;">High Score: <span id="highScoreDisplay">0</span></div>
        </div>
        
        <div id="message">
            <div id="msgTitle">LEVEL 1</div>
            <div id="startPrompt">Press space to start!</div>
            <div id="playButton"></div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 遊戲狀態
        let gameState = 'START'; 
        let level = 1; let savedCheckpoint = 1; 
        let lives = 3; let score = 0;
        let highScore = localStorage.getItem('catMarioHighScore') || 0;
        document.getElementById('highScoreDisplay').innerText = highScore;

        // 物理設定
        const GRAVITY = 0.6;
        const JUMP_FORCE = -12;
        const DOUBLE_JUMP_FORCE = -10;
        const SPEED = 5;
        const GROUND_Y = 350; 

        // 玩家設定
        const player = {
            x: 50, y: 300, 
            radius: 20, w: 40, h: 40, 
            vx: 0, vy: 0,
            grounded: false, 
            facing: 1, 
            squash: 1, stretch: 1,
            canDoubleJump: true,
            rotation: 0,
            isRolling: false
        };

        let platforms = []; let enemies = []; let coins = [];
        let goal = null; let boss = null;

        // ==========================================
        // --- 繪圖函數區 ---
        // ==========================================

        // 繪製橘貓球
        function drawCatBall(ctx, x, y, radius, facing, sx, sy, rotation) {
            ctx.save();
            let squashOffset = radius * (1 - sy);
            ctx.translate(x + radius, y + radius + squashOffset); 
            ctx.rotate(rotation);
            ctx.scale(sx, sy); 
            
            ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#FFA500'; ctx.fill();
            ctx.lineWidth = 3; ctx.strokeStyle = '#8B4500'; ctx.stroke();

            ctx.fillStyle = '#8B4500';
            ctx.beginPath(); ctx.ellipse(0, -radius+5, 4, 8, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(-8, -radius+7, 3, 6, -0.3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(8, -radius+7, 3, 6, 0.3, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#FFA500';
            ctx.beginPath(); 
            ctx.moveTo(-16, -radius + 8); ctx.lineTo(-12, -radius - 4); ctx.lineTo(-6, -radius + 5);
            ctx.moveTo(16, -radius + 8); ctx.lineTo(12, -radius - 4); ctx.lineTo(6, -radius + 5);
            ctx.fill(); ctx.stroke();
            
            ctx.fillStyle = '#FFC0CB'; 
            ctx.beginPath(); ctx.moveTo(-14, -radius + 7); ctx.lineTo(-12, -radius - 1); ctx.lineTo(-8, -radius + 6); ctx.fill();
            ctx.beginPath(); ctx.moveTo(14, -radius + 7); ctx.lineTo(12, -radius - 1); ctx.lineTo(8, -radius + 6); ctx.fill();

            let faceX = facing * 4;
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(-6 + faceX, 0, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(6 + faceX, 0, 3, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#FFF';
            ctx.beginPath(); ctx.arc(-5 + faceX, -1, 1, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(7 + faceX, -1, 1, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#FF69B4';
            ctx.beginPath(); ctx.arc(0 + faceX, 4, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
            ctx.arc(-2 + faceX, 7, 2, 0, Math.PI); ctx.stroke();
            ctx.beginPath(); ctx.arc(2 + faceX, 7, 2, 0, Math.PI); ctx.stroke();
            
            ctx.restore();
        }

        // 繪製敵人球
        function drawEnemyBall(ctx, x, y, radius, facing, rotation) {
            ctx.save();
            ctx.translate(x + radius, y + radius);
            ctx.rotate(rotation);
            ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI*2);
            ctx.fillStyle = '#666'; ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = '#333'; ctx.stroke();
            let lookX = facing * 4;
            ctx.fillStyle = '#F00';
            ctx.beginPath(); ctx.rect(-8 + lookX, -4, 6, 6); ctx.fill();
            ctx.beginPath(); ctx.rect(2 + lookX, -4, 6, 6); ctx.fill();
            ctx.fillStyle = '#FFF';
            ctx.beginPath(); ctx.moveTo(-3+lookX, 5); ctx.lineTo(-1+lookX, 9); ctx.lineTo(1+lookX, 5); ctx.fill();
            ctx.restore();
        }

        // 繪製金幣
        function drawCoin(ctx, coin) {
            if (coin.collected) return;
            ctx.save();
            ctx.translate(coin.x, coin.y);
            ctx.beginPath(); ctx.arc(0, 0, coin.r, 0, Math.PI*2);
            ctx.fillStyle = '#FFD700'; ctx.fill();
            ctx.strokeStyle = '#DAA520'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, coin.r * 0.6, 0, Math.PI*2);
            ctx.fillStyle = '#FFFACD'; ctx.fill();
            ctx.restore();
        }

        // 繪製背景
        function drawBackground() {
            ctx.save(); ctx.resetTransform(); 
            let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, "#5C94FC"); skyGradient.addColorStop(1, "#87CEEB"); 
            ctx.fillStyle = skyGradient; ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#FFD700'; ctx.fillRect(680, 40, 40, 40); 
            ctx.fillStyle = 'rgba(255, 215, 0, 0.5)'; ctx.fillRect(670, 50, 60, 20); ctx.fillRect(690, 30, 20, 60);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fillRect(100, 80, 80, 25); ctx.fillRect(120, 60, 40, 20);
            ctx.fillRect(550, 120, 90, 25); ctx.fillRect(580, 100, 50, 20);
            ctx.fillRect(50, 200, 60, 20);
            ctx.restore();
        }
        // ==========================================

        // --- 關卡生成 ---
        function generateLevel(lvl) {
            platforms = []; enemies = []; boss = null; goal = null; coins = [];

            // 【修正】確保出生點安全，並加長以產生重疊，消除接縫線
            platforms.push({x: -200, y: GROUND_Y, w: 650, h: 50, type: 'ground', visible: true});
            let currentGroundX = 400; 

            const levelEnd = (lvl === 6) ? 1000 : 2800; 
            let lastGroundPlatform = null; // 追蹤最後一塊地面

            while(currentGroundX < levelEnd) {
                let blockWidth = 200 + Math.random() * 300;
                if (currentGroundX < 50 && currentGroundX + blockWidth > 50) blockWidth = Math.max(blockWidth, 300);

                lastGroundPlatform = {x: currentGroundX, y: GROUND_Y, w: blockWidth, h: 50, type: 'ground', visible: true};
                platforms.push(lastGroundPlatform);

                if (Math.random() > 0.5) {
                     coins.push({x: currentGroundX + blockWidth / 2, y: GROUND_Y - 15, r: 8, collected: false});
                }

                let gapWidth = 60 + Math.random() * 80; 
                currentGroundX += blockWidth + gapWidth;
            }

            if (lvl < 6) {
                let currentX = 200;
                for(let i=0; i<5 + lvl; i++) {
                    let gap = 100 + Math.random() * 50;
                    let height = 250 - Math.random() * 100;
                    let width = 100 + Math.random() * 100;
                    platforms.push({x: currentX, y: height, w: width, h: 20, type: 'plat', visible: true});
                    
                    if (Math.random() > 0.4) {
                        enemies.push({
                            x: currentX + 20, y: height - 30, r: 15, w:30, h:30,
                            vx: 2 + (lvl * 0.2), minX: currentX, maxX: currentX + width,
                            rotation: 0 
                        });
                    }
                    if (Math.random() > 0.3) {
                         coins.push({x: currentX + width / 2 + (Math.random()*20-10), y: height - 15, r: 8, collected: false});
                    }

                    currentX += width + gap;
                }
                // 【修正】確保終點在最後一塊實心地面上
                if (lastGroundPlatform) {
                    goal = {x: lastGroundPlatform.x + lastGroundPlatform.w - 60, y: GROUND_Y - 50, w: 40, h: 50};
                } else {
                    goal = {x: currentGroundX, y: 300, w: 40, h: 50}; // fallback
                }
            }

            if (lvl === 6) {
                platforms = [];
                platforms.push({x: -200, y: GROUND_Y, w: 1200, h: 50, type: 'ground', visible: true});
                platforms.push({x: 50, y: 250, w: 100, h: 20, type: 'plat', visible: true});
                platforms.push({x: 650, y: 250, w: 100, h: 20, type: 'plat', visible: true});
                platforms.push({x: 350, y: 150, w: 100, h: 20, type: 'plat', visible: true});
                
                coins.push({x: 100, y: 235, r: 8, collected: false});
                coins.push({x: 700, y: 235, r: 8, collected: false});
                coins.push({x: 400, y: 135, r: 8, collected: false});

                boss = {
                    x: 400, y: 250, r: 50, w: 100, h: 100,
                    vx: 3, vy: 0, hp: 10, active: true, minX: 0, maxX: 700,
                    rotation: 0 
                };
            }
        }

        // --- 輸入控制 ---
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true; if(e.code === 'Space') e.preventDefault(); 
            if (e.code === 'Space' || e.code === 'KeyW') {
                if (gameState === 'START' || gameState === 'GAME_OVER' || gameState === 'WIN') { resetGame(); }
                else if (gameState === 'PLAYING') {
                    if (player.grounded) {
                        jump(JUMP_FORCE);
                        player.canDoubleJump = true; 
                    } else if (player.canDoubleJump) {
                        jump(DOUBLE_JUMP_FORCE);
                        player.canDoubleJump = false; 
                        player.isRolling = true; 
                    }
                }
            }
        });

        function jump(force) {
            player.vy = force;
            player.grounded = false;
            player.squash = 0.7; player.stretch = 1.3; 
        }

        window.addEventListener('keyup', e => keys[e.code] = false);
        document.getElementById('playButton').addEventListener('click', () => { if (gameState !== 'PLAYING') resetGame(); });

        function resetGame() { level = savedCheckpoint; lives = 3; score = 0; updateUI(); startLevel(); }
        function startLevel() {
            player.x = 50; player.y = 300; player.vx = 0; player.vy = 0; player.rotation = 0; player.isRolling = false;
            generateLevel(level); gameState = 'PLAYING';
            let msg = `LEVEL ${level}`; let prompt = 'Press SPACE to Start';
            if (level === 3) { savedCheckpoint = Math.max(savedCheckpoint, 3); msg += (savedCheckpoint === 3 && level===3) ? '\n★ CHECKPOINT SAVED ★' : '\n(CHECKPOINT LOADED)'; }
            else if (level === 6) { savedCheckpoint = 6; msg += '\n★ BOSS CHECKPOINT ★'; }
            showMessage(msg, prompt, 2000);
        }
        function updateUI() {
            document.getElementById('levelDisplay').innerText = level;
            document.getElementById('livesDisplay').innerText = '❤️'.repeat(lives);
            document.getElementById('scoreDisplay').innerText = score;
        }
        function showMessage(titleText, promptText, duration = 0) {
            const msgDiv = document.getElementById('message'); const title = document.getElementById('msgTitle');
            const prompt = document.getElementById('startPrompt'); const playBtn = document.getElementById('playButton');
            title.innerText = titleText; prompt.innerText = promptText;
            if (gameState === 'START') { playBtn.style.display = 'block'; prompt.style.display = 'block'; }
            else { playBtn.style.display = 'none'; prompt.style.display = (promptText ? 'block' : 'none'); }
            msgDiv.style.display = 'flex';
            if (duration > 0) setTimeout(() => { if (gameState === 'PLAYING') msgDiv.style.display = 'none'; }, duration);
        }

        // --- 物理更新 ---
        function update() {
            if (gameState !== 'PLAYING') return;
            if (keys['ArrowLeft'] || keys['KeyA']) { player.vx = -SPEED; player.facing = -1; }
            else if (keys['ArrowRight'] || keys['KeyD']) { player.vx = SPEED; player.facing = 1; }
            else { player.vx = 0; }

            player.vy += GRAVITY; player.x += player.vx; player.y += player.vy;

            let speed = Math.abs(player.vy);
            if (!player.grounded) {
                player.stretch = 1 + speed * 0.02; player.squash = 1 - speed * 0.01;
            } else {
                player.squash += (1 - player.squash) * 0.2; player.stretch += (1 - player.stretch) * 0.2;
            }

            if (player.isRolling) {
                let dir = player.vx > 0 ? 1 : (player.vx < 0 ? -1 : 1);
                player.rotation += 0.3 * dir; 
            }

            player.grounded = false;
            platforms.forEach(p => {
                if (player.x < p.x + p.w && player.x + player.w > p.x &&
                    player.y < p.y + p.h && player.y + player.h > p.y) {
                    if (player.vy > 0 && player.y + player.h < p.y + 25) {
                        player.y = p.y - player.h; 
                        player.vy = 0;
                        player.grounded = true;
                        player.canDoubleJump = true; 
                        player.isRolling = false;
                        player.rotation = 0; 
                        if(speed > 2) { player.squash = 1.3; player.stretch = 0.7; }
                    }
                }
            });

            if (player.y > canvas.height + 50) playerDie();
            
            if (goal && player.x > goal.x && player.x < goal.x + goal.w && player.y > goal.y) levelComplete();

            coins.forEach(c => {
                if (!c.collected) {
                    let dx = (player.x + player.radius) - c.x;
                    let dy = (player.y + player.radius) - c.y;
                    if (Math.sqrt(dx*dx + dy*dy) < player.radius + c.r) {
                        c.collected = true; score += 100; updateUI();
                    }
                }
            });

            enemies.forEach(e => {
                e.x += e.vx; 
                if (e.vx < 0 && e.x < e.minX) { e.x = e.minX; e.vx *= -1; }
                else if (e.vx > 0 && e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.vx *= -1; }
                
                e.rotation += e.vx / e.r; 

                let dx = (player.x + player.radius) - (e.x + e.r); 
                let dy = (player.y + player.radius) - (e.y + e.r); 
                let dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < player.radius + e.r) {
                    if (player.vy > 0 && player.y + player.radius < e.y) { e.y = 1000; player.vy = -8; score += 100; updateUI(); } 
                    else { playerDie(); }
                }
            });

            if (boss && boss.active) {
                boss.x += boss.vx; 
                if (boss.vx < 0 && boss.x < boss.minX) { boss.x = boss.minX; boss.vx *= -1; }
                else if (boss.vx > 0 && boss.x + boss.w > boss.maxX) { boss.x = boss.maxX - boss.w; boss.vx *= -1; }
                
                boss.rotation += boss.vx / boss.r; 

                let dx = (player.x + player.radius) - (boss.x + boss.r); 
                let dy = (player.y + player.radius) - (boss.y + boss.r); 
                let dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < player.radius + boss.r) {
                    if (player.vy > 0 && player.y + player.radius < boss.y + 15) {
                        boss.hp--; player.vy = -10; 
                        if (boss.hp <= 0) { boss.active = false; score += 5000; gameState = 'WIN'; savedCheckpoint = 1; showMessage('YOU WIN!\nCat Hero!', 'Press Space to Restart', 0); }
                    } else { playerDie(); }
                }
            }
        }

        function playerDie() {
            lives--; updateUI();
            if (lives > 0) { player.x = 50; player.y = 300; player.vy = 0; player.rotation = 0; player.isRolling = false; }
            else {
                gameState = 'GAME_OVER';
                let msg = 'GAME OVER\nScore: ' + score;
                if (savedCheckpoint > 1) msg += `\nCheckpoint: Level ${savedCheckpoint}`;
                showMessage(msg, 'Press Space to Restart');
                if (score > highScore) { highScore = score; localStorage.setItem('catMarioHighScore', highScore); document.getElementById('highScoreDisplay').innerText = highScore; }
            }
        }
        function levelComplete() { score += 500; updateUI(); level++; startLevel(); }

        // --- 主繪圖迴圈 ---
        function draw() {
            drawBackground();
            ctx.save();
            let camX = 0; if (level !== 6) camX = Math.max(0, player.x - 200);
            ctx.translate(-camX, 0);

            platforms.forEach(p => {
                if (!p.visible) return;
                ctx.fillStyle = '#8B4513'; ctx.fillRect(p.x, p.y + 5, p.w, p.h - 5);
                ctx.fillStyle = '#228B22'; ctx.fillRect(p.x, p.y, p.w, 5);
                ctx.fillStyle = '#000';
                ctx.fillRect(p.x, p.y, p.w, 2); ctx.fillRect(p.x, p.y + p.h - 2, p.w, 2);
                ctx.fillRect(p.x, p.y, 2, p.h); ctx.fillRect(p.x + p.w - 2, p.y, 2, p.h);
                
                // 【修正】地板點綴 (嚴格限制範圍)
                if (p.type === 'ground') {
                    ctx.fillStyle = '#5d3a1a'; 
                    let seed = p.x; 
                    // X範圍：從 p.x + 10 開始，到 p.x + p.w - 15 結束 (避開左右邊緣)
                    for(let i = p.x + 10; i < p.x + p.w - 15; i += 30) {
                        seed = (seed * 9301 + 49297) % 233280; 
                        let randX = (seed % 10);
                        // Y範圍：計算可用高度，確保在土壤層內 (草地以下，底部以上)
                        // 土壤從 p.y + 5 開始。點高 6px。
                        let soilTop = p.y + 5;
                        let soilBottom = p.y + p.h - 2; // 避開底部邊框
                        let availableH = soilBottom - soilTop - 8; // 額外緩衝
                        let randY = (seed / 233280) * availableH + soilTop + 2;

                        ctx.fillRect(i + randX, randY, 6, 6);
                    }
                }
            });

            coins.forEach(c => drawCoin(ctx, c));

            if (goal) {
                ctx.fillStyle = '#8B4513'; ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
                ctx.fillStyle = '#5c3317'; ctx.fillRect(goal.x, goal.y, goal.w, 4); ctx.fillRect(goal.x, goal.y, 4, goal.h);
                ctx.fillRect(goal.x + goal.w - 4, goal.y, 4, goal.h); ctx.fillRect(goal.x + 10, goal.y + 10, goal.w - 20, 4);
                ctx.fillRect(goal.x + 10, goal.y + goal.h - 15, goal.w - 20, 4);
                ctx.fillStyle = '#DAA520'; ctx.fillRect(goal.x + goal.w - 12, goal.y + goal.h / 2 - 4, 8, 8);
                ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.strokeRect(goal.x, goal.y, goal.w, goal.h);
                ctx.fillStyle = '#000'; ctx.font = '16px "Press Start 2P"'; ctx.textAlign = 'center'; ctx.fillText('GOAL', goal.x + goal.w / 2, goal.y - 10); ctx.textAlign = 'start';
            }

            enemies.forEach(e => {
                if(e.y < 500) drawEnemyBall(ctx, e.x, e.y, e.r, e.vx > 0 ? 1 : -1, e.rotation);
            });

            if (boss && boss.active) {
                drawEnemyBall(ctx, boss.x, boss.y, boss.r, boss.vx > 0 ? 1 : -1, boss.rotation);
                // 【修正】血條更靠近BOSS
                let barWidth = 104;
                let barX = boss.x + boss.r - barWidth / 2; 
                let barY = boss.y - boss.r - 10; // 距離縮短到 10px
                ctx.fillStyle = '#000'; ctx.fillRect(barX, barY, barWidth, 14);
                ctx.fillStyle = 'red'; ctx.fillRect(barX + 2, barY + 2, 100, 10);
                ctx.fillStyle = '#228B22'; ctx.fillRect(barX + 2, barY + 2, 100 * (boss.hp / 10), 10);
            }

            if (gameState === 'PLAYING' || gameState === 'START') {
                drawCatBall(ctx, player.x, player.y, player.radius, player.facing, player.squash, player.stretch, player.rotation);
            }

            ctx.restore(); 
            requestAnimationFrame(draw);
        }

        showMessage('LEVEL 1', 'Press space to start!', 0);
        setInterval(update, 1000/60);
        draw();
    </script>
</body>
</html>
