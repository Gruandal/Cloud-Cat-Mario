<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Mario | Bouncing Ball Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: 'Fredoka One', cursive; /* 圓潤可愛字體 */
            overflow: hidden;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            border: 4px solid #333;
            border-radius: 10px;
            width: 800px;
            height: 400px;
            background: #87CEEB; /* 天空藍 */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui {
            position: absolute; top: 20px; left: 20px;
            font-size: 20px; text-shadow: 2px 2px 0 #333;
            pointer-events: none;
        }
        .hud-right {
            position: absolute; top: 20px; right: 20px;
            text-align: right; pointer-events: none;
            text-shadow: 2px 2px 0 #333; font-size: 20px;
        }
        #message {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: flex; flex-direction: column;
            align-items: center; gap: 20px;
            z-index: 10; width: 100%;
            text-shadow: 3px 3px 0 #333; 
        }
        #msgTitle { font-size: 40px; margin: 0; }
        #startPrompt { font-size: 20px; animation: blink 1s infinite; }
        
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div class="ui">
            <div>Level: <span id="levelDisplay">1</span></div>
            <div>Lives: <span id="livesDisplay">❤️❤️❤️</span></div>
        </div>
        <div class="hud-right">
            <div>Score: <span id="scoreDisplay">0</span></div>
        </div>
        
        <div id="message">
            <div id="msgTitle">LEVEL 1</div>
            <div id="startPrompt">Press SPACE to Start</div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 遊戲變數
        let gameState = 'START'; 
        let level = 1; let lives = 3; let score = 0;
        
        // 物理常數
        const GRAVITY = 0.6;
        const JUMP_FORCE = -12;
        const SPEED = 5;
        const BOUNCE_FACTOR = -0.3; // 彈跳係數

        // 玩家設定 (橘貓球)
        const player = {
            x: 50, y: 300, 
            radius: 20, // 半徑
            vx: 0, vy: 0,
            grounded: false, 
            facing: 1, // 1:右, -1:左
            squash: 1, // 擠壓係數 (Y軸)
            stretch: 1 // 拉伸係數 (X軸)
        };

        let platforms = []; let enemies = []; let goal = null;

        // --- 繪製橘貓球 (幾何繪圖) ---
        function drawCatBall(ctx, x, y, radius, facing, sx, sy) {
            ctx.save();
            ctx.translate(x, y + radius); // 設底點為基準
            ctx.scale(sx, sy); // 彈性變形
            ctx.translate(0, -radius); // 回到中心

            // 1. 身體 (橘色圓球)
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#FFA500'; // 亮橘色
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#8B4500'; // 深橘邊框
            ctx.stroke();

            // 2. 虎斑紋 (頭頂三條)
            ctx.fillStyle = '#8B4500';
            ctx.beginPath(); ctx.ellipse(0, -radius+5, 4, 8, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(-8, -radius+8, 3, 6, -0.2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(8, -radius+8, 3, 6, 0.2, 0, Math.PI*2); ctx.fill();

            // 3. 耳朵 (三角形)
            ctx.fillStyle = '#FFA500';
            ctx.beginPath();
            // 左耳
            ctx.moveTo(-radius + 2, -radius + 10);
            ctx.lineTo(-radius - 5, -radius - 5);
            ctx.lineTo(-radius + 12, -radius + 2);
            // 右耳
            ctx.moveTo(radius - 2, -radius + 10);
            ctx.lineTo(radius + 5, -radius - 5);
            ctx.lineTo(radius - 12, -radius + 2);
            ctx.fill();
            ctx.stroke();
            // 耳內粉色
            ctx.fillStyle = '#FFC0CB';
            ctx.beginPath(); ctx.moveTo(-radius+2, -radius+8); ctx.lineTo(-radius-2, -radius-2); ctx.lineTo(-radius+10, -radius+4); ctx.fill();
            ctx.beginPath(); ctx.moveTo(radius-2, -radius+8); ctx.lineTo(radius+2, -radius-2); ctx.lineTo(radius-10, -radius+4); ctx.fill();

            // 4. 臉部 (根據 facing 移動)
            let faceX = facing * 6; // 眼睛偏移量

            // 眼睛 (黑豆)
            ctx.fillStyle = '#000';
            // 左眼
            ctx.beginPath(); ctx.arc(-6 + faceX, -2, 3, 0, Math.PI*2); ctx.fill();
            // 右眼
            ctx.beginPath(); ctx.arc(6 + faceX, -2, 3, 0, Math.PI*2); ctx.fill();
            
            // 眼神光 (可愛亮點)
            ctx.fillStyle = '#FFF';
            ctx.beginPath(); ctx.arc(-5 + faceX, -3, 1, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(7 + faceX, -3, 1, 0, Math.PI*2); ctx.fill();

            // 鼻子 (粉紅)
            ctx.fillStyle = '#FF69B4';
            ctx.beginPath(); ctx.arc(0 + faceX, 3, 2.5, 0, Math.PI*2); ctx.fill();

            // 嘴巴 (W型)
            ctx.beginPath();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.arc(-2 + faceX, 6, 2, 0, Math.PI); 
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(2 + faceX, 6, 2, 0, Math.PI);
            ctx.stroke();

            ctx.restore();
        }

        // --- 繪製敵人球 (灰貓) ---
        function drawEnemyBall(ctx, x, y, radius, facing) {
            ctx.save();
            ctx.translate(x, y);
            
            // 身體
            ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI*2);
            ctx.fillStyle = '#666'; ctx.fill(); // 灰色
            ctx.lineWidth = 2; ctx.strokeStyle = '#333'; ctx.stroke();

            // 紅眼 (跟隨方向)
            let lookX = facing * 4;
            ctx.fillStyle = '#F00';
            ctx.beginPath(); ctx.rect(-8 + lookX, -4, 6, 6); ctx.fill(); // 方形眼比較兇
            ctx.beginPath(); ctx.rect(2 + lookX, -4, 6, 6); ctx.fill();

            // 尖牙
            ctx.fillStyle = '#FFF';
            ctx.beginPath(); ctx.moveTo(-3+lookX, 5); ctx.lineTo(-1+lookX, 9); ctx.lineTo(1+lookX, 5); ctx.fill();

            ctx.restore();
        }

        // --- 關卡與邏輯 ---
        function generateLevel(lvl) {
            platforms = []; enemies = []; goal = null;
            // 地板
            platforms.push({x: -200, y: 350, w: 2000, h: 50, type: 'ground'});

            if (lvl < 6) {
                let cx = 200;
                for(let i=0; i<4+lvl; i++) {
                    let w = 100 + Math.random()*100;
                    let h = 250 - Math.random()*80;
                    platforms.push({x: cx, y: h, w: w, h: 20, type: 'plat'});
                    
                    if (Math.random()>0.3) {
                        enemies.push({ x: cx+20, y: h-20, r: 15, vx: 2, minX: cx, maxX: cx+w });
                    }
                    cx += w + 100;
                }
                goal = {x: cx, y: 300, w: 40, h: 50};
            }
        }

        // --- 物理更新 ---
        function update() {
            if (gameState !== 'PLAYING') return;

            // 左右移動
            if (keys['ArrowLeft'] || keys['KeyA']) {
                player.vx = -SPEED;
                player.facing = -1;
            } else if (keys['ArrowRight'] || keys['KeyD']) {
                player.vx = SPEED;
                player.facing = 1;
            } else {
                player.vx = 0;
            }

            // 跳躍與重力
            player.vy += GRAVITY;
            player.x += player.vx;
            player.y += player.vy;

            // 彈性動畫邏輯 (Squash & Stretch)
            // 速度越快，拉得越長 (Stretch)
            // 落地時，壓扁 (Squash)
            let speed = Math.abs(player.vy);
            if (!player.grounded) {
                player.stretch = 1 + speed * 0.02; // Y軸拉長
                player.squash = 1 - speed * 0.01;  // X軸變窄
            } else {
                // 地面恢復
                player.squash += (1 - player.squash) * 0.2;
                player.stretch += (1 - player.stretch) * 0.2;
            }

            // 碰撞檢測 (圓形 vs 矩形)
            player.grounded = false;
            
            // 簡單的地板碰撞 (只檢測腳下)
            if (player.y + player.radius > 350) { // 地面
                if(player.vy > 0) {
                    player.y = 350 - player.radius;
                    player.vy = 0;
                    player.grounded = true;
                    // 落地瞬間變扁
                    if(speed > 2) { player.squash = 1.3; player.stretch = 0.7; }
                }
            }

            platforms.forEach(p => {
                // AABB 簡化碰撞
                if (player.x > p.x && player.x < p.x + p.w &&
                    player.y + player.radius > p.y && player.y - player.radius < p.y + p.h) {
                    
                    // 從上方落下
                    if (player.vy > 0 && player.y < p.y + 20) {
                        player.y = p.y - player.radius;
                        player.vy = 0;
                        player.grounded = true;
                        if(speed > 2) { player.squash = 1.3; player.stretch = 0.7; }
                    }
                }
            });

            // 敵人移動
            enemies.forEach(e => {
                e.x += e.vx;
                if (e.x < e.minX || e.x > e.maxX) e.vx *= -1;
                
                // 碰撞
                let dx = player.x - e.x;
                let dy = player.y - e.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < player.radius + e.r) {
                    if (player.vy > 0 && player.y < e.y) {
                        // 踩死敵人
                        e.y = 1000;
                        player.vy = -8;
                        score += 100;
                    } else {
                        // 受傷
                        gameState = 'GAME_OVER';
                        updateUI();
                    }
                }
            });

            if (goal && Math.abs(player.x - goal.x) < 30 && Math.abs(player.y - goal.y) < 30) {
                level++;
                startLevel();
            }
            
            if (player.y > 500) { gameState = 'GAME_OVER'; updateUI(); }
        }

        // --- 繪圖循環 ---
        function draw() {
            // 背景
            ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 攝影機跟隨
            ctx.save();
            let camX = Math.max(0, player.x - 400);
            ctx.translate(-camX, 0);

            // 畫平台
            platforms.forEach(p => {
                ctx.fillStyle = '#654321'; ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = '#4CAF50'; ctx.fillRect(p.x, p.y, p.w, 5);
            });

            // 畫終點
            if(goal) {
                ctx.fillStyle = 'gold'; ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
                ctx.fillStyle = '#000'; ctx.font = '16px Arial'; ctx.fillText('GOAL', goal.x, goal.y-10);
            }

            // 畫敵人
            enemies.forEach(e => {
                if(e.y < 500) drawEnemyBall(ctx, e.x, e.y, e.r, e.vx > 0 ? 1 : -1);
            });

            // 畫主角 (橘貓球)
            if (gameState === 'PLAYING' || gameState === 'START') {
                drawCatBall(ctx, player.x, player.y, player.radius, player.facing, player.squash, player.stretch);
            }

            ctx.restore();
            requestAnimationFrame(draw);
        }

        // --- 控制 ---
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if(e.code === 'Space' || e.code === 'KeyW') {
                if(gameState !== 'PLAYING') resetGame();
                else if(player.grounded) {
                    player.vy = JUMP_FORCE;
                    player.grounded = false;
                    // 跳躍瞬間拉長
                    player.squash = 0.7; player.stretch = 1.3;
                }
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function resetGame() {
            player.x = 50; player.y = 300; player.vx = 0; player.vy = 0;
            score = 0; level = 1;
            generateLevel(1);
            gameState = 'PLAYING';
            document.getElementById('message').style.display = 'none';
        }
        
        function updateUI() {
            document.getElementById('scoreDisplay').innerText = score;
            if(gameState === 'GAME_OVER') {
                document.getElementById('message').style.display = 'flex';
                document.getElementById('msgTitle').innerText = 'GAME OVER';
                document.getElementById('startPrompt').innerText = 'Press SPACE to Restart';
            }
        }

        function startLevel() {
            player.x = 50; player.y = 300; player.vx = 0; player.vy = 0;
            generateLevel(level);
            document.getElementById('levelDisplay').innerText = level;
        }

        // 啟動
        generateLevel(1);
        draw();
        setInterval(update, 1000/60);

    </script>
</body>
</html>
