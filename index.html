<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Mario | Vibe Edition</title>
    <style>
        /* --- CSS 樣式區 --- */
        body {
            margin: 0;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none; /* 防止連點選取文字 */
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }
        canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            display: block;
            border-radius: 4px;
        }
        .ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
        }
        .hud-right {
            position: absolute;
            top: 10px;
            right: 10px;
            text-align: right;
            pointer-events: none;
            text-shadow: 2px 2px 0 #000;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            text-shadow: 3px 3px 0 #000;
            display: none;
            white-space: pre-wrap; /* 讓 \n 換行生效 */
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div class="ui">
            <div>Level: <span id="levelDisplay">1</span></div>
            <div>Lives: <span id="livesDisplay">❤️❤️❤️</span></div>
        </div>
        <div class="hud-right">
            <div>Score: <span id="scoreDisplay">0</span></div>
            <div style="font-size: 14px; color: #ffd700;">High Score: <span id="highScoreDisplay">0</span></div>
        </div>
        <div id="message">
            <div id="msgTitle">LEVEL 1</div>
            <div style="font-size: 20px; margin-top: 10px;">Press SPACE to Start</div>
        </div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <script>
        // --- JavaScript 邏輯區 ---

        // 核心變數
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 遊戲狀態
        let gameState = 'START'; 
        let level = 1;
        let savedCheckpoint = 1; // 檢查點記錄
        let lives = 3;
        let score = 0;
        let highScore = localStorage.getItem('catMarioHighScore') || 0;
        document.getElementById('highScoreDisplay').innerText = highScore;

        // 物理設定
        const GRAVITY = 0.5;
        const JUMP_FORCE = -14;
        const SPEED = 5;

        // 玩家設定 (白色貓里奧)
        const player = {
            x: 50, y: 300, 
            w: 24, h: 32, // 瘦長身形
            vx: 0, vy: 0,
            color: '#FFFFFF', // 白色
            grounded: false,
            facingRight: true 
        };

        // 關卡物件
        let platforms = [];
        let enemies = [];
        let goal = null; 
        let boss = null;

        // --- 關卡生成 ---
        function generateLevel(lvl) {
            platforms = [];
            enemies = [];
            boss = null;
            goal = null;
            
            // 地板
            platforms.push({x: 0, y: 350, w: 2000, h: 50, type: 'ground'});

            // 一般關卡 (1-5)
            if (lvl < 6) {
                let currentX = 200;
                for(let i=0; i<5 + lvl; i++) {
                    let gap = 100 + Math.random() * 50;
                    let height = 250 - Math.random() * 100;
                    let width = 100 + Math.random() * 100;
                    
                    platforms.push({x: currentX, y: height, w: width, h: 20, type: 'plat'});
                    
                    if (lvl > 1 && Math.random() > 0.3) {
                        enemies.push({
                            x: currentX + 20, y: height - 30, w: 30, h: 30, 
                            vx: 2 + (lvl * 0.2), 
                            patrolStart: currentX, 
                            patrolEnd: currentX + width - 30,
                            type: 'dog'
                        });
                    }
                    currentX += width + gap;
                }
                // 設定終點
                goal = {x: currentX, y: 300, w: 40, h: 50};
            }

            // 第 6 關：BOSS 戰 (最終關)
            if (lvl === 6) {
                platforms = []; 
                platforms.push({x: 0, y: 350, w: 800, h: 50, type: 'ground'}); // 地板
                platforms.push({x: 50, y: 250, w: 100, h: 20, type: 'plat'}); // 左跳台
                platforms.push({x: 650, y: 250, w: 100, h: 20, type: 'plat'}); // 右跳台
                platforms.push({x: 350, y: 150, w: 100, h: 20, type: 'plat'}); // 中間高台
                
                boss = {
                    x: 400, y: 250, w: 100, h: 100, 
                    vx: 3, vy: 0, hp: 10, // Boss 血量
                    color: '#8B0000', 
                    active: true
                };
            }
        }

        // --- 輸入控制 ---
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if(e.code === 'Space') e.preventDefault(); 

            // 支援 Space 或 W 跳躍
            if (e.code === 'Space' || e.code === 'KeyW') {
                if (gameState === 'START' || gameState === 'GAME_OVER' || gameState === 'WIN') {
                    resetGame();
                } else if (gameState === 'PLAYING' && player.grounded) {
                    player.vy = JUMP_FORCE;
                    player.grounded = false;
                }
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function resetGame() {
            // 讀取檢查點
            level = savedCheckpoint; 
            lives = 3;
            score = 0;
            updateUI();
            startLevel();
        }

        function startLevel() {
            player.x = 50; player.y = 200; player.vx = 0; player.vy = 0;
            generateLevel(level);
            gameState = 'PLAYING';
            
            let msg = `LEVEL ${level}`;
            
            // 檢查點訊息邏輯
            if (level === 3) {
                if (savedCheckpoint < 3) {
                    savedCheckpoint = 3;
                    msg += '\n★ CHECKPOINT SAVED ★';
                } else {
                    msg += '\n(CHECKPOINT LOADED)';
                }
            } else if (level === 6) {
                if (savedCheckpoint < 6) {
                    savedCheckpoint = 6;
                    msg += '\n★ BOSS CHECKPOINT ★';
                } else {
                    msg += '\n(BOSS RESTART)';
                }
            }

            showMessage(msg, 2000);
        }

        function updateUI() {
            document.getElementById('levelDisplay').innerText = level;
            document.getElementById('livesDisplay').innerText = '❤️'.repeat(lives);
            document.getElementById('scoreDisplay').innerText = score;
        }

        function showMessage(text, duration = 0) {
            const msgDiv = document.getElementById('message');
            const title = document.getElementById('msgTitle');
            title.innerText = text;
            msgDiv.style.display = 'block';
            
            if (duration > 0) {
                setTimeout(() => {
                    if (gameState === 'PLAYING') msgDiv.style.display = 'none';
                }, duration);
            }
        }

        // --- 碰撞檢測 ---
        function checkRectCollision(r1, r2) {
            if (!r1 || !r2) return false;
            return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
                   r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
        }

        // --- 遊戲循環 ---
        function update() {
            if (gameState !== 'PLAYING') return;

            // 加入 A / D 鍵控制
            if (keys['ArrowLeft'] || keys['KeyA']) {
                player.vx = -SPEED;
                player.facingRight = false;
            } else if (keys['ArrowRight'] || keys['KeyD']) {
                player.vx = SPEED;
                player.facingRight = true;
            } else {
                player.vx = 0;
            }

            // 物理運算
            player.vy += GRAVITY;
            player.x += player.vx;
            
            platforms.forEach(p => {
                if (checkRectCollision(player, p)) {
                    if (player.vx > 0) player.x = p.x - player.w;
                    else if (player.vx < 0) player.x = p.x + p.w;
                }
            });

            player.y += player.vy;
            player.grounded = false;

            platforms.forEach(p => {
                if (checkRectCollision(player, p)) {
                    if (player.vy > 0) {
                        player.y = p.y - player.h;
                        player.grounded = true;
                        player.vy = 0;
                    } else if (player.vy < 0) {
                        player.y = p.y + p.h;
                        player.vy = 0;
                    }
                }
            });

            if (player.y > canvas.height) playerDie();

            if (goal && checkRectCollision(player, goal)) {
                levelComplete();
            }

            // 敵人碰撞
            enemies.forEach(enemy => {
                enemy.x += enemy.vx;
                if (enemy.x > enemy.patrolEnd || enemy.x < enemy.patrolStart) enemy.vx *= -1;
                
                if (checkRectCollision(player, enemy)) {
                    if (player.vy > 0 && player.y + player.h - 10 < enemy.y + enemy.h/2) {
                        enemy.y = 1000;
                        player.vy = -5;
                        score += 100;
                        updateUI();
                    } else {
                        playerDie();
                    }
                }
            });

            // BOSS 戰鬥
            if (boss && boss.active) {
                boss.x += boss.vx;
                if (boss.x < 0 || boss.x > 700) boss.vx *= -1;

                if (checkRectCollision(player, boss)) {
                    if (player.vy > 0 && player.y + player.h - 15 < boss.y + boss.h/2) {
                        boss.hp--;
                        player.vy = -8;
                        boss.color = '#ff5555';
                        setTimeout(() => boss.color = '#8B0000', 200);
                        
                        // BOSS 死亡 -> 遊戲勝利
                        if (boss.hp <= 0) {
                            boss.active = false;
                            score += 5000;
                            gameState = 'WIN'; 
                            savedCheckpoint = 1; // 勝利後，檢查點重置回第1關
                            showMessage('YOU WIN!\nCat Hero!\nPress Space to Restart', 0);
                        }
                    } else {
                        playerDie();
                    }
                }
            }
        }

        function playerDie() {
            lives--;
            updateUI();
            if (lives > 0) {
                player.x = 50; player.y = 200; player.vy = 0;
            } else {
                gameState = 'GAME_OVER';
                let msg = 'GAME OVER\nScore: ' + score;
                if (savedCheckpoint > 1) {
                    msg += `\nCheckpoint: Level ${savedCheckpoint}`;
                }
                showMessage(msg);
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('catMarioHighScore', highScore);
                    document.getElementById('highScoreDisplay').innerText = highScore;
                }
            }
        }

        function levelComplete() {
            score += 500;
            updateUI();
            level++;
            startLevel();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            let camX = 0;
            if (level !== 6) {
                camX = Math.max(0, player.x - 200); 
            }
            ctx.translate(-camX, 0);

            // 畫平台
            ctx.fillStyle = '#654321';
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = '#4CAF50';
                ctx.fillRect(p.x, p.y, p.w, 5);
                ctx.fillStyle = '#654321';
            });

            // 畫終點
            if (goal) {
                ctx.fillStyle = '#FFD700';
                ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
                ctx.fillStyle = '#000';
                ctx.font = '20px Arial';
                ctx.fillText('GOAL', goal.x, goal.y - 10);
            }

            // 畫敵人 (雙耳惡犬)
            enemies.forEach(e => {
                if(e.y < 500) {
                    // 身體
                    ctx.fillStyle = '#555';
                    ctx.fillRect(e.x, e.y, e.w, e.h);
                    
                    // 雙耳
                    ctx.beginPath();
                    ctx.moveTo(e.x, e.y);           
                    ctx.lineTo(e.x + 5, e.y - 10);  
                    ctx.lineTo(e.x + 10, e.y);      
                    
                    ctx.moveTo(e.x + e.w - 10, e.y); 
                    ctx.lineTo(e.x + e.w - 5, e.y - 10); 
                    ctx.lineTo(e.x + e.w, e.y);      
                    ctx.fill();

                    // 紅眼 (會轉動)
                    ctx.fillStyle = '#FF0000'; 
                    let faceOffset = (e.vx > 0) ? 8 : 0;
                    ctx.fillRect(e.x + 4 + faceOffset, e.y + 8, 4, 4);
                    ctx.fillRect(e.x + 18 + faceOffset, e.y + 8, 4, 4);
                }
            });

           if (boss && boss.active) {
                ctx.fillStyle = boss.color;
                
                // 1. 畫耳朵 (跟身體同色)
                ctx.beginPath();
                // 左耳
                ctx.moveTo(boss.x, boss.y);
                ctx.lineTo(boss.x + 20, boss.y - 30);
                ctx.lineTo(boss.x + 40, boss.y);
                // 右耳
                ctx.moveTo(boss.x + boss.w - 40, boss.y);
                ctx.lineTo(boss.x + boss.w - 20, boss.y - 30);
                ctx.lineTo(boss.x + boss.w, boss.y);
                ctx.fill();

                // 2. 畫身體
                ctx.fillRect(boss.x, boss.y, boss.w, boss.h);

                // 3. 畫眼睛
                ctx.fillStyle = '#fff';
                ctx.fillRect(boss.x + 20, boss.y + 20, 20, 20);
                ctx.fillRect(boss.x + 60, boss.y + 20, 20, 20);

                // 4. 血條
                ctx.fillStyle = 'red';
                ctx.fillRect(boss.x, boss.y - 20, 100, 10);
                ctx.fillStyle = 'green';
                ctx.fillRect(boss.x, boss.y - 20, 100 * (boss.hp / 10), 10);
            }

            // 畫玩家 (白貓里奧)
            const p = player;
            const x = p.x;
            const y = p.y;
            const w = p.w;
            const h = p.h;

            // 身體
            ctx.fillStyle = p.color; 
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, h);

            // 耳朵
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + 5, y - 8); 
            ctx.lineTo(x + 10, y);
            ctx.moveTo(x + w, y);
            ctx.lineTo(x + w - 5, y - 8);
            ctx.lineTo(x + w - 10, y);
            ctx.fill();
            ctx.stroke();

            // 表情
            ctx.fillStyle = '#000000';
            let eyeOffset = p.facingRight ? 4 : 0;
            ctx.fillRect(x + 6 + eyeOffset, y + 10, 3, 3);
            ctx.fillRect(x + w - 9 + eyeOffset, y + 10, 3, 3);

           
            ctx.restore(); 
            
            requestAnimationFrame(draw);
        }

        setInterval(update, 1000/60);
        draw();
    </script>
</body>
</html>
